<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frame</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='2' width='22' height='28' rx='3' fill='%23e8b04b'/><rect x='9' y='6' width='14' height='20' rx='1' fill='%23141416'/></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/movies">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="2" width="22" height="28" rx="3"/><rect x="9" y="6" width="14" height="20" rx="1" class="cut"/></svg>
      Frame
    </a>
    <nav class="tabs">
      <a href="/movies" data-tab="movies">Movies</a>
      <a href="/shows" data-tab="shows">Shows</a>
    </nav>
    <div class="tools">
      <input id="search" type="search" placeholder="Search…" autocomplete="off">
      <div class="seg" role="group" aria-label="Filter">
        <button data-filter="all" class="on">All</button>
        <button data-filter="missing">Missing</button>
      </div>
      <button id="rescan" class="icon-btn" title="Rescan library" aria-label="Rescan library">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>

  <main id="view"></main>
  <footer id="foot" class="foot"></footer>

  <dialog id="poster-dialog">
    <form method="dialog" class="dlg" id="poster-form">
      <header>
        <div>
          <p class="eyebrow" id="dlg-eyebrow"></p>
          <h2 id="dlg-title"></h2>
        </div>
        <button class="icon-btn" value="cancel" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <div class="dlg-body">
        <div class="compare">
          <figure>
            <div class="slot" id="dlg-current"></div>
            <figcaption>Current</figcaption>
          </figure>
          <svg class="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <figure>
            <label class="slot drop" id="dlg-drop">
              <input type="file" id="dlg-file" accept="image/jpeg,image/png,image/webp" hidden>
              <span class="drop-hint">
                <svg viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
                Drop an image,<br>click to browse,<br>or paste
              </span>
              <img id="dlg-preview" alt="" hidden>
            </label>
            <figcaption>New</figcaption>
          </figure>
        </div>

        <div class="url-row">
          <input type="url" id="dlg-url" placeholder="…or paste an image URL or ThePosterDB link">
        </div>
        <p class="source" id="dlg-source"></p>
        <div class="sources">
          <button type="button" class="btn ghost" id="dlg-tmdb" hidden>Use TMDB poster</button>
        </div>

        <p class="note" id="dlg-note"></p>
        <p class="error" id="dlg-error" hidden></p>
      </div>

      <footer>
        <button class="btn ghost" value="cancel">Cancel</button>
        <button class="btn primary" id="dlg-save" type="button" disabled>Save poster</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
