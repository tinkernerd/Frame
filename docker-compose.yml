# Run on the server:  docker compose up -d --build
# Settings come from a .env file next to this one (see server.env.example).
services:
  frame:
    build: .
    container_name: frame
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TPDB_USERNAME=${TPDB_USERNAME:-}
    # Run as the user/group that owns the media on your NAS, so uploads can write
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${MOVIES_PATH:-./test-library/movies}:/media/movies
      - ${SHOWS_PATH:-./test-library/shows}:/media/shows
      - ./config:/config
    restart: unless-stopped
